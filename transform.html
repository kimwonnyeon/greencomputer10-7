<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>변형</title>
    <link rel="stylesheet" href="css/transform.css" />
  </head>
  <body>
    <!-- 이동 변형 -->
    <div class="container">
      <!-- X 방향으로 이동 -->
      <div class="origin">
        <div class="moveX"></div>
      </div>
      <!-- y 방향으로 이동 -->
      <div class="origin">
        <div class="moveY"></div>
      </div>
      <!-- xy 방향으로 이동 -->
      <div class="origin">
        <div class="moveXY"></div>
      </div>
    </div>
  </body>
</html>
